# ~/.config/helix/languages.toml

# ---------- python ----------
[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[[language]]
name = "python"
language-servers = ["basedpyright", "ruff"]
auto-format = true
formatter = { command = "ruff", args = ["format", "-"] }

# ---------- typst ----------
[language-server.tinymist]
command = "tinymist"
# optional: set formatter mode; tinymist bundles typstyle
config = { formattermode = "typstyle", exportpdf = "ontype" }

[[language]]
name = "typst"
language-servers = ["tinymist"]
auto-format = true

# ---------- toml ----------
[language-server.taplo]
command = "taplo"
args = ["lsp", "stdin"]

[[language]]
name = "toml"
language-servers = ["taplo"]
auto-format = true

# ---------- bash ----------
[language-server.bash-language-server]
command = "bash-language-server"
args = ["start"]

[[language]]
name = "bash"
language-servers = ["bash-language-server"]
auto-format = true
formatter = { command = "shfmt", args = ["-i", "2", "-"] }

# ---------- markdown ----------
[language-server.marksman]
command = "marksman"
args = ["server"]

[[language]]
name = "markdown"
language-servers = ["marksman"]
# no auto-format by default; markdown formatters are opinionated. uncomment to use prettier:
# auto-format = true
# formatter = { command = "prettier", args = ["--parser", "markdown"] }

# ---------- yaml ----------
[language-server.yaml-language-server]
command = "yaml-language-server"
args = ["--stdio"]

[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]
auto-format = true
